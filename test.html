<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фото поверх кнопки</title>
  <style>
    .wrapper {
      position: relative;  /* чтобы все внутри могли накладываться */
      width: 300px;
      height: 300px;
    }

    .my-btn {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      cursor: pointer;
      z-index: 1; /* кнопка снизу */
    }

    .my-photo {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 150px;
      height: 150px;
      border-radius: 10px;
      z-index: 2; /* фото сверху */
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <button class="my-btn"></button>
    <img src="po.png" alt="Фото" class="my-photo">
  </div>
</body>
</html>
